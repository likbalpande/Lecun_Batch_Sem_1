<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header {
            display: flex;
            justify-content: space-between;
            padding: 24px;
            background-color: aqua;
            font-size: 24px;
        }

        nav {
            display: flex;
            gap: 16px;
        }

        nav {
            display: none;
        }

        @media (width > 600px) {
            header {
                background-color: bisque;
            }

            nav {
                display: flex;
            }
        }
    </style>
</head>

<body>
    <header>
        <div>My App</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Help</a>
            <a href="#">Contact us</a>
        </nav>
        <div>Ok</div>
    </header>
</body>

</html>
